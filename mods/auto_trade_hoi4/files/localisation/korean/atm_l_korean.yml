 ATM_FACTIONS_HELP:0 "세력 전체에 1~9순위(1순위가 가장 먼저)를 정합니다(그 세력 모든 나라의 점수에 더해지고, 금지면 전체 금지). 나라 지정에 순위가 있는 나라는 금지가 풀립니다.\n세력은 게임 중 바뀌므로 지정은 지금의 세력 지도자에 붙고, 지도자가 바뀌면 남은 지도자의 지정이 새 지도자로 옮겨집니다. 세력이 사라지면 지정도 사라집니다.\n목록은 이 탭을 열 때와 '목록 새로고침'을 누를 때 현재 세력으로 다시 만듭니다."
