 ATM_RULES_HELP:0 "분류·대륙마다 1~9순위(1순위가 가장 먼저)를 정합니다. 나라마다 해당하는 항목의 점수(1순위 +4점 ~ 4순위 +1점, 5순위 0점, 6순위 -1점 ~ 9순위 -4점)를 모두 더한 값이 그 나라의 점수이고, 점수가 높은 나라부터 사며 같은 점수면 공장당 실제로 들어오는 양이 많은 나라부터 삽니다.\n하나라도 §R금지§!면 그 나라와는 거래하지 않습니다(나라 지정이 5순위가 아니면 예외). 기본은 5순위입니다. 버튼: +는 우선순위 높임(1순위 쪽) · -는 낮춤(9순위 다음은 금지)."
