 ATM_L_PARTIAL_TT:0 "공장 1개분(공장당 자원량)보다 적게 수출할 수 있는 나라와 거래할지 정합니다.\n§Y정량만§!: 공장 1개분을 다 채울 수 있는 나라만(이미 일부만 쓰는 공장이 생긴 거래는 그 공장을 뺍니다)\n§Y부족할 때만 허용§!: 정량 거래로 못 채운 부족분이 남을 때만\n§Y항상 허용§!: 우선순위대로 부분 거래도 사용"
