 ATM_L_COOLDOWN_TT:0 "거래를 늘리거나 바꾼 뒤 이 일수 동안은 같은 자원의 과잉 감축·재배치를 쉽니다(부족 보충은 바로 함). 기본 1일입니다. 게임이 보고하는 잔량은 우리 거래에 따라 하루 이틀 흔들릴 수 있어, 늘리면 안정적이고 줄이면 빠릅니다. 과잉은 이틀 연속 확인된 뒤 목표에 닿을 만큼 한 번에 줄이고, 줄인 직후 다시 부족해지면 한동안 줄이지 않습니다."
