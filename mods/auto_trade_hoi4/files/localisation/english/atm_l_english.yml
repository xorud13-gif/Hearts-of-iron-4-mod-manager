 ATM_RULES_H1:0 "Weight per category"
 ATM_RULES_H2:0 "Weight per continent (capital)"
 ATM_RULES_HELP:0 "Every category and continent gets a rank 1-9 (rank 1 comes first). A country's score is the sum of the points of everything it matches (rank 1 = +4 ... rank 4 = +1, rank 5 and unset = 0, rank 6 = -1 ... rank 9 = -4); higher scores are bought from first, equal scores by the amount one factory actually brings.\nAny §RBanned§! match excludes the country (unless the country itself has a rank in the country list). Buttons: + raises the priority (toward rank 1) · - lowers it (rank 5 -> unset -> rank 6 ... rank 9 -> banned)."
