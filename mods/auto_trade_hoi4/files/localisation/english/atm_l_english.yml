 ATM_FACTIONS_HELP:0 "Gives a whole faction a rank 1-9 (rank 1 comes first; added to the score of every member, banned = all members banned). A country with its own rank is exempt from the ban.\nFactions change during play, so the assignment sits on the CURRENT faction leader; when the leader changes it moves to the new leader, and it is dropped when the faction ceases to exist.\nThe list is rebuilt from the current factions when this tab opens and on 'Refresh list'."
 ATM_FENTRY_INFO:0 "§Y[?This.atm_fcount|0]§! members"
 ATM_FENTRY_NAME:0 "[This.GetFactionName] ([This.GetNameWithFlag])"
 ATM_FENTRY_PIN:0 "[This.atm_txt_fpin]"
 ATM_FENTRY_PIN_TT:0 "Priority for every member of this faction. -: lower the priority · +: raise it (banned / rank 9 ... 6 / unset / rank 5 ... 1)"
 ATM_FUELNOTE_0:0 "§YOil is not in 'Auto+fuel' mode, so the fuel target is not used (change it on the Resources tab).§!"
 ATM_FUELNOTE_1:0 "Fuel target active"
 ATM_FUEL_HELP:0 "Each unit of surplus oil gives 2 fuel per hour (before modifiers). The engine estimates consumption from the recent fuel trend and aims for enough surplus oil to reach the target within the refill period.\nAt the target it goes back to what production needs."
 ATM_FUEL_INFO:0 "Fuel now §Y[?atm_in_fuel|1]§!k / max [?atm_in_fuel_max|1]k · extra oil wanted for fuel §Y[?atm_st_fuelx|1]§!\n[atm_txt_fuelnote]"
