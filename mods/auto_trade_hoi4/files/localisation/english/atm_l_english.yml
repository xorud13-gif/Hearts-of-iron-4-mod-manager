 ATM_L_BLOCK_DAYS:0 "Cancel blocked deal after (days)"
 ATM_L_BLOCK_DAYS_TT:0 "A deal that delivers nothing (route blocked) is cancelled after this many days and replaced."
 ATM_L_BUDGET_MODE:0 "Trade factory budget"
 ATM_L_BUDGET_MODE_TT:0 "Upper limit on civilian factories spent on imports. When short, higher-priority resources come first."
 ATM_L_BUDGET_VAL:0 "Budget value"
 ATM_L_BUDGET_VAL_TT:0 "Factories or percent of civilian factories (see above)"
 ATM_L_COOLDOWN:0 "Cut / move interval (days)"
 ATM_L_COOLDOWN_TT:0 "After a deal grew or changed, surplus cuts and moves of the same resource wait this long (shortages are filled at once). Default 1 day. The balance the game reports can swing for a day or two after our own deals: a longer interval is steadier, a shorter one faster. A surplus must be seen on two days in a row, then is cut by as many factories as reach the target at once, and a cut that has to be undone soon after holds further cuts for a while."
 ATM_L_FUEL_ABS:0 "Target (absolute, thousands)"
 ATM_L_FUEL_ABS_TT:0 "Imports extra oil until fuel reaches this amount (thousands)."
 ATM_L_FUEL_DAYS:0 "Refill period (days)"
 ATM_L_FUEL_DAYS_TT:0 "Buys enough extra oil to reach the target in about this many days, given current consumption."
 ATM_L_FUEL_MAX:0 "Max extra oil factories for fuel"
 ATM_L_FUEL_MAX_TT:0 "Cap on oil bought only to refill fuel, in civilian factories. 0 = no cap."
 ATM_L_FUEL_PCT:0 "Target (% of capacity)"
 ATM_L_FUEL_PCT_TT:0 "Imports extra oil until fuel reaches this share of the capacity."
 ATM_L_FUEL_TYPE:0 "Fuel target type"
 ATM_L_FUEL_TYPE_TT:0 "Fuel target as a share of the capacity or as an absolute amount (thousands)."
 ATM_L_MIN_EFF:0 "Minimum delivery efficiency (%)"
 ATM_L_MIN_EFF_TT:0 "Deals delivering less than this share are not expanded and are moved when a better partner exists.\nIf sea deals fall below it, no new sea deals are made for that resource (convoy shortage)."
 ATM_L_PARTIAL:0 "Partial deals"
 ATM_L_PARTIAL_MIN:0 "Partial deal minimum (%)"
 ATM_L_PARTIAL_MIN_TT:0 "A partial deal must still bring at least this share of a full factory."
 ATM_L_PARTIAL_TT:0 "Whether to buy from countries that can sell less than one factory's worth.\n§YFull only§!: only countries that fill a whole factory (a current deal whose last factory is only partly used loses it)\n§YWhen short§!: only for what full deals cannot cover\n§YAlways§!: partial deals in normal priority order"
 ATM_L_REBALANCE:0 "Move to better partners"
 ATM_L_REBALANCE_TT:0 "When on, deals move to a partner with a higher priority or better delivery. As many factories as needed move in one day."
