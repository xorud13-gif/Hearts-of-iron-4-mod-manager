 BWC_RESULT_1:0 "마지막 분쟁: 전문 지휘관 투입 · 사단 §Y[?bwc_st_own|0]§!개(전문 지휘관 직속) + §Y[?bwc_st_near|0]§!개(가까운 사단) · 미배정 처리 §Y[?bwc_st_freed|0]§!개 · 지금까지 §Y[?bwc_st_wars|0]§!회"
