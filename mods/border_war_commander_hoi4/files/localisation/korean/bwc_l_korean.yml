l_korean:
 BWC_BTN_AUTO:0 "장군 자동"
 BWC_BTN_AUTO_TT:0 "전문 지휘관 지정을 해제하고 바닐라 규칙으로 돌아갑니다. 국경 분쟁 지휘관과 사단은 게임이 고릅니다."
 BWC_BTN_PICK:0 "지정"
 BWC_BTN_PICK_TT:0 "이 지휘관을 국경 분쟁 전문 지휘관으로 정합니다(이전 지정은 해제)."
 BWC_BTN_REFRESH:0 "목록 새로고침"
 BWC_BTN_REFRESH_TT:0 "지휘관 목록과 현재 상태를 다시 읽습니다."
 BWC_CHOSEN:0 "§G전문 지휘관§!"
 BWC_CLOSE_TT:0 "닫기"
 BWC_COUNT:0 "지휘관 §Y[?bwc_ldr_n|0]§!명 (앞 80명까지 표시)"
 BWC_EMPTY:0 "지휘관이 없습니다. '목록 새로고침'을 눌러 보세요."
 BWC_HELP:0 "지휘관 한 명을 §Y지정§!하면 이 나라의 국경 분쟁마다: (1) 분쟁 그룹 지휘관은 항상 그 사람입니다. 그 사람이 없거나 다른 분쟁 중이면 다른 지휘관을 데려가지 않고 지휘관 없이 싸웁니다. (2) 사단은 6개(설정 파일 border_war_commander.txt 의 division_count)이며, 그 사람이 직접 지휘하는 군의 사단을 먼저 쓰고 모자라면 국경에 가까운 사단으로 채웁니다. (3) 그 사람의 군에서 분쟁에 안 들어간 사단은 §Y미배정§!으로 빠집니다.\n집단군을 지휘하는 원수는 직속 사단이 없어 가까운 사단 6개로 채워지고, 하위 군은 그대로 둡니다. 멀리 있는 사단도 그대로 보내므로 늦게 도착하면 분쟁에서 질 수 있습니다(상대만 국경에 있는 채 14일)."
