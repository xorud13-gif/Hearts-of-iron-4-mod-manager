 BWC_BTN_AUTO:0 "Auto (vanilla)"
 BWC_BTN_AUTO_TT:0 "Removes the specialist and goes back to the vanilla rules: the game picks the commander and the divisions of a border war."
 BWC_BTN_PICK:0 "Choose"
 BWC_BTN_PICK_TT:0 "Makes this commander the border conflict specialist (the previous one is dropped)."
 BWC_BTN_REFRESH:0 "Refresh list"
 BWC_BTN_REFRESH_TT:0 "Reads the commanders and the state again."
 BWC_CHOSEN:0 "§GSpecialist§!"
 BWC_CLOSE_TT:0 "Close"
 BWC_COUNT:0 "Commanders §Y[?bwc_ldr_n|0]§! (first 80 shown)"
 BWC_EMPTY:0 "No commanders. Press 'Refresh list'."
 BWC_HELP:0 "Choose one commander and every border war of this country: (1) is led by that commander, always - if they are gone or busy in another border war, no other commander is taken and the group fights without one; (2) gets 6 divisions (division_count in border_war_commander.txt): the divisions of the army that commander leads directly first, then the ones nearest to the border; (3) the commander's divisions that did not go become §Yunassigned§!.\nA field marshal leading an army group has no direct divisions: the 6 nearest are taken and the armies below are left alone. Divisions far away are sent as well - if they arrive late the border war can be lost (only the other side at the border for 14 days)."
