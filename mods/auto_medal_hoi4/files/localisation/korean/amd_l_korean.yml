l_korean:
 AMD_BTN_DEFAULTS:0 "설정 기본값으로"
 AMD_BTN_DEFAULTS_TT:0 "모든 설정을 기본값으로 되돌립니다(장군·원수 순위, 편제 이름 순위, 훈장 순서는 유지, 자동 부여는 꺼짐)."
 AMD_BTN_DRY:0 "[amd_txt_dry]"
 AMD_BTN_DRY_TT:0 "켜면 엔진이 계획만 세우고 실제로 훈장을 주지 않습니다.\n무엇을 줄지는 게임 폴더의 auto_medal.log 에서 확인합니다."
 AMD_BTN_FMREFRESH:0 "목록 새로고침"
 AMD_BTN_GENREFRESH:0 "목록 새로고침"
 AMD_BTN_MOVE1:0 "위"
 AMD_BTN_MOVE1_TT:0 "한 칸 위로"
 AMD_BTN_MOVE2:0 "아래"
 AMD_BTN_MOVE2_TT:0 "한 칸 아래로"
 AMD_BTN_MOVE3:0 "맨위"
 AMD_BTN_MOVE3_TT:0 "맨 위(1순위)로"
 AMD_BTN_MOVE4:0 "맨아래"
 AMD_BTN_MOVE4_TT:0 "맨 아래로"
 AMD_BTN_MREFRESH:0 "목록 새로고침"
 AMD_BTN_MRESET:0 "순서 기본으로"
 AMD_BTN_MRESET_TT:0 "훈장 순서를 게임이 정의한 기본 순서로 되돌립니다."
 AMD_BTN_ON:0 "[amd_txt_on]"
 AMD_BTN_ON_TT:0 "자동 훈장 부여를 켜거나 끕니다. 켜면 바로 한 번 실행합니다.\n꺼져 있으면 훈장을 주지 않습니다."
 AMD_BTN_ORDER:0 "[amd_txt_order]"
 AMD_BTN_RUN:0 "지금 실행"
 AMD_BTN_RUN_TT:0 "현재 설정으로 지금 바로 훈장을 부여합니다(일시정지 중에도).\n설정만 바꾸면 다음 날 자동으로 반영됩니다."
 AMD_BTN_SHORT:0 "[amd_txt_short]"
 AMD_BTN_TPLREFRESH:0 "목록 새로고침"
 AMD_CLOSE_TT:0 "닫기"
 AMD_DEC_MAX_GRANTS_TT:0 "클릭 -1 · Shift+클릭 -5"
 AMD_DEC_PP_FLOOR_TT:0 "클릭 -5 · Shift+클릭 -50"
 AMD_ENGINE:0 "[amd_txt_engine]"
 AMD_ENG_ERR:0 "§R엔진 오류 [?amd_st_err|0] - auto_medal.log 를 확인하세요.§!"
 AMD_ENG_MP:0 "§Y사람 플레이어가 둘 이상이라 엔진을 부르지 않습니다(싱글플레이 전용).§!"
 AMD_ENG_NEW:0 "§Y아직 실행 전입니다. 날짜가 지나거나 '지금 실행'을 누르면 엔진을 확인합니다.§!"
 AMD_ENG_NONE:0 "§R엔진(DLL)이 응답하지 않습니다. 훈장을 주지 않습니다. 모드 관리 프로그램에서 설치를 확인하세요.§!"
 AMD_ENG_OK:0 "엔진 정상 · 마지막 실행 부여 요청 §Y[?amd_st_grants|0]§!건 · [amd_txt_stop]"
 AMD_FM_COUNT:0 "현재 §Y[?amd_fm_n|0]§!명 (앞 24명까지 표시)"
 AMD_FM_EMPTY:0 "목록이 비어 있습니다. '목록 새로고침'을 누르세요(지휘관이 없으면 비어 있습니다)."
 AMD_FM_HELP:0 "원수(집단군 지휘관)마다 1~9순위(1순위가 가장 먼저, 기본 5순위)를 정합니다. +는 높임, -는 낮춤(9순위 다음은 금지). 사단의 점수 = 편제 이름 점수 + 소속 군단 지휘관(장군) 점수 + 그 군단이 속한 집단군 지휘관(원수) 점수입니다. §R금지§!로 두면 그 지휘관이 지휘하는 군단(원수는 집단군 전체)의 사단은 대상에서 빠집니다.\n순위는 지휘관 본인에게 저장되어 세이브에 남고 다른 군단으로 옮겨도 따라갑니다. 목록은 이 탭을 열 때와 '목록 새로고침'을 누를 때 현재 지휘관으로 다시 만듭니다."
