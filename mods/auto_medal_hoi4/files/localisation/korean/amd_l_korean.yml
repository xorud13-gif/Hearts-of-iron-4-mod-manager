 AMD_HELP1:0 "다음 사단에게 줍니다: (1) 편제 이름 순위 + 소속 군단 지휘관(장군) 순위 + 그 위 집단군 지휘관(원수) 순위의 점수 합(1순위 +4 ~ 4순위 +1, 5순위 0, 6순위 -1 ~ 9순위 -4, 기본 5순위)이 높은 사단 (2) 점수가 같으면 위의 '부대 순서' (3) 그래도 같으면 게임 순서. 금지로 둔 편제 이름의 사단과 금지한 장군·원수가 지휘하는 사단은 받지 못합니다.\n사단이 받는 훈장은 '훈장 순위' 탭의 맨 위 훈장입니다. 훈장은 사단의 가장 최근 전공 기록에 붙습니다. 비용(정치력)은 게임이 계산하며 훈장을 가진 수가 늘수록 비쌉니다."
 AMD_INC_MAX_GRANTS_TT:0 "클릭 +1 · Shift+클릭 +5"
 AMD_INC_PP_FLOOR_TT:0 "클릭 +5 · Shift+클릭 +50"
 AMD_L_MAX_GRANTS:0 "한 번에 최대 부여 수"
 AMD_L_MAX_GRANTS_TT:0 "하루에(또는 '지금 실행' 한 번에) 부여하는 훈장의 최대 개수. 사단 하나에는 한 번에 훈장 하나만 줍니다(훈장 수가 늘면 비용이 오르기 때문)."
 AMD_L_ORDER:0 "부대 순서(같은 점수일 때)"
 AMD_L_ORDER_TT:0 "사단 종류·지휘관 순위의 점수가 같은 사단들 사이의 순서입니다.\n§Y보유 훈장§!: 지휘관이 이미 가진 훈장 수\n§Y부여 가능 훈장§!: 아직 훈장을 받을 수 있는 전공 기록(이력 항목) 수"
 AMD_L_PP_FLOOR:0 "정치력 하한선"
 AMD_L_PP_FLOOR_TT:0 "훈장을 부여한 뒤에도 이 정치력은 남깁니다(부여 후 잔여 정치력 기준). 정치력에서 훈장 비용을 뺀 값이 이 값 미만이 되면 부여하지 않습니다."
 AMD_L_SHORT:0 "정치력이 모자랄 때"
 AMD_L_SHORT_TT:0 "§Y기다림§!: 가장 먼저인 사단의 첫 훈장을 살 수 없으면 정치력이 쌓일 때까지 아무것도 주지 않습니다.\n§Y더 싼 훈장·다음 부대로§!: 더 싼 훈장이나 다음 사단으로 넘어가 살 수 있는 것을 줍니다."
 AMD_MEDALS_HELP:0 "지금 이 나라가 줄 수 있는 훈장만 나옵니다(정부 형태·날짜·집중 등에 따라 바뀜). 맨 위(1순위)가 가장 먼저 쓰입니다.\n사라진 훈장은 목록에서 빠지고, 새로 줄 수 있게 된 훈장은 맨 아래(후순위)에 들어옵니다."
 AMD_MEDFX_1:0 "사단 회복률 §G+10%§! · 숙련병 손실률 §G-7%§!"
 AMD_MEDFX_10:0 "사단 조직력 §G+10%§! · 사단 방어 §G+5%§!"
