 AMD_BTN_MREFRESH:0 "Refresh list"
 AMD_BTN_MRESET:0 "Default order"
 AMD_BTN_MRESET_TT:0 "Puts the medals back into the game's own order."
 AMD_BTN_ON:0 "[amd_txt_on]"
 AMD_BTN_ON_TT:0 "Turns auto medals on or off. Turning it on runs it once right away.\nWhile off, no medal is granted."
 AMD_BTN_ORDER:0 "[amd_txt_order]"
 AMD_BTN_RUN:0 "Run now"
 AMD_BTN_RUN_TT:0 "Grants medals right now with the current settings (also while paused).\nOtherwise changed settings apply at the next day."
