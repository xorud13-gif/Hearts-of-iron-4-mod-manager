 AMD_FM_HELP:0 "Every field marshal (army group commander) gets a rank 1-9 (rank 1 first). + raises it, - lowers it (rank 5 -> unset -> rank 6 ... rank 9 -> banned). A division's score = its template name score + the score of its corps commander (general) + the score of the commander of the army group that corps belongs to (marshal). A §RBanned§! commander removes the divisions of the corps they lead (a marshal: the whole army group).\nThe rank is stored on the commander and kept in the save; it follows them to another corps. The list is rebuilt from the current commanders when this tab opens and on 'Refresh list'."
