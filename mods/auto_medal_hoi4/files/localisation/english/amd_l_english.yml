 AMD_BTN_DEFAULTS:0 "Default settings"
 AMD_BTN_DEFAULTS_TT:0 "Resets every setting (general / marshal ranks, template name ranks and the medal order are kept; auto medals are switched off)."
 AMD_BTN_DRY:0 "[amd_txt_dry]"
 AMD_BTN_DRY_TT:0 "When on, the engine only plans and grants nothing.\nSee auto_medal.log in the game folder for what it would grant."
