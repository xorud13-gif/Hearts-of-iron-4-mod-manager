 AMD_HELP1:0 "The next division is chosen by (1) the sum of its template name score + the score of the commander of its corps (general) + the score of the commander of the army group above (marshal) (rank 1 = +4 ... rank 4 = +1, rank 5 / unset 0, rank 6 = -1 ... rank 9 = -4), (2) the division order above, (3) the game's own order. Banned template names and divisions led by banned generals / marshals get nothing.\nThe medal a division gets is the top one on the Medal order tab. It is put on the division's newest war record. The political power cost is the game's own and rises with every medal held."
 AMD_INC_MAX_GRANTS_TT:0 "Click +1 · Shift+click +5"
 AMD_INC_PP_FLOOR_TT:0 "Click +5 · Shift+click +50"
 AMD_L_MAX_GRANTS:0 "Most grants per run"
 AMD_L_MAX_GRANTS_TT:0 "Most medals granted per day (or per 'Run now'). A division gets at most one per run (its cost rises with every medal it holds)."
 AMD_L_ORDER:0 "Division order (equal scores)"
 AMD_L_ORDER_TT:0 "Order between divisions with equal type / commander scores.\n§YMedals held§!: medals its officer already has\n§YGrantable§!: history entries that can still receive a medal"
 AMD_L_PP_FLOOR:0 "Political power floor"
 AMD_L_PP_FLOOR_TT:0 "Political power that must remain AFTER a grant. A medal is not granted if the power left after paying its cost would be below this."
 AMD_L_SHORT:0 "When political power is short"
 AMD_L_SHORT_TT:0 "§YWait§!: if the first division's best medal is unaffordable, nothing is granted until power builds up.\n§YTry cheaper / next§!: falls back to cheaper medals or the next division."
 AMD_MEDALS_HELP:0 "Only the medals this country can grant right now are listed (they change with government, date, focuses ...). The top one (rank 1) is used first.\nA medal that is no longer available drops out; a newly available one is added at the bottom (lowest priority)."
